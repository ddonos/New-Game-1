<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>new-game</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const openedBuiltIndex = window.location.pathname.replaceAll('\\', '/').endsWith('/dist/index.html')

      if (window.location.protocol === 'file:' && !openedBuiltIndex) {
        window.location.replace(new URL('./dist/index.html', window.location.href))
      } else {
        await import('/src/main.ts')
      }
    </script>
  </body>
</html>
